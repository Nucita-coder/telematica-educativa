<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradArq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#1c1c1f"/>
    </linearGradient>
  </defs>

  <rect width="800" height="380" rx="4" fill="url(#bgGradArq)" stroke="#2e2e33" stroke-width="1.5"/>

  <rect x="250" y="16" width="300" height="28" rx="4" fill="#202024" stroke="#3e3e44" stroke-width="1"/>
  <text x="400" y="35" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">MODELOS DE ARQUITECTURA DE RED</text>

  <!-- LADO IZQUIERDO: CLIENTE - SERVIDOR -->
  <g transform="translate(40, 60)">
    <rect width="345" height="290" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="172" y="30" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">1. Modelo Cliente - Servidor</text>
    <text x="172" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">(Paradigma Centralizado: Aulas Virtuales LMS)</text>

    <!-- Enlaces radiales -->
    <line x1="172" y1="130" x2="80" y2="90" stroke="#38bdf8" stroke-width="2"/>
    <line x1="172" y1="130" x2="265" y2="90" stroke="#38bdf8" stroke-width="2"/>
    <line x1="172" y1="130" x2="80" y2="200" stroke="#38bdf8" stroke-width="2"/>
    <line x1="172" y1="130" x2="265" y2="200" stroke="#38bdf8" stroke-width="2"/>

    <!-- Servidor central -->
    <circle cx="172" cy="130" r="30" fill="#2563eb" stroke="#38bdf8" stroke-width="2"/>
    <text x="172" y="134" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">SERVIDOR</text>

    <!-- Clientes periféricos -->
    <circle cx="80" cy="90" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="80" y="94" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">Cliente 1</text>

    <circle cx="265" cy="90" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="265" y="94" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">Cliente 2</text>

    <circle cx="80" cy="200" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="80" y="204" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">Cliente 3</text>

    <circle cx="265" cy="200" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="265" y="204" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">Cliente 4</text>

    <!-- Características -->
    <rect x="20" y="235" width="305" height="42" rx="6" fill="#0f172a"/>
    <text x="172" y="252" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">
      <tspan font-weight="700" fill="#60a5fa">Flujo:</tspan> Petición (Request) &amp; Respuesta (Response)
    </text>
    <text x="172" y="266" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">
      Gestión centralizada de autenticación y base de datos.
    </text>
  </g>

  <!-- LADO DERECHO: P2P (PEER TO PEER) -->
  <g transform="translate(415, 60)">
    <rect width="345" height="290" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="172" y="30" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">2. Modelo Peer-to-Peer (P2P)</text>
    <text x="172" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">(Paradigma Distribuido: Videoconferencias WebRTC)</text>

    <!-- Enlaces mallados entre pares -->
    <polygon points="172,75 260,135 230,210 114,210 84,135" fill="none" stroke="#10b981" stroke-width="2"/>
    <line x1="172" y1="75" x2="230" y2="210" stroke="#059669" stroke-width="1.2" stroke-dasharray="3,3"/>
    <line x1="172" y1="75" x2="114" y2="210" stroke="#059669" stroke-width="1.2" stroke-dasharray="3,3"/>
    <line x1="84" y1="135" x2="260" y2="135" stroke="#059669" stroke-width="1.2" stroke-dasharray="3,3"/>

    <!-- Nodos pares -->
    <circle cx="172" cy="75" r="20" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="172" y="79" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">Nodo A</text>

    <circle cx="260" cy="135" r="20" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="260" y="139" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">Nodo B</text>

    <circle cx="230" cy="210" r="20" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="230" y="214" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">Nodo C</text>

    <circle cx="114" cy="210" r="20" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="114" y="214" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">Nodo D</text>

    <circle cx="84" cy="135" r="20" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="84" y="139" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">Nodo E</text>

    <!-- Características -->
    <rect x="20" y="235" width="305" height="42" rx="6" fill="#0f172a"/>
    <text x="172" y="252" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">
      <tspan font-weight="700" fill="#34d399">Flujo:</tspan> Cada nodo actúa como cliente y servidor
    </text>
    <text x="172" y="266" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">
      Tolerancia a fallos y sin punto único de interrupción.
    </text>
  </g>
</svg>