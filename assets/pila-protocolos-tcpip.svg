<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradPila" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#1c1c1f"/>
    </linearGradient>
    <linearGradient id="layer4Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="layer3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="layer2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="layer1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" rx="4" fill="url(#bgGradPila)" stroke="#2e2e33" stroke-width="1.5"/>

  <rect x="250" y="16" width="300" height="28" rx="4" fill="#202024" stroke="#3e3e44" stroke-width="1"/>
  <text x="400" y="35" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">ARQUITECTURA DE PROTOCOLOS TCP/IP</text>

  <!-- LAYER 4: APLICACIÓN -->
  <g transform="translate(50, 60)">
    <rect width="700" height="65" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="15" y="12" width="160" height="40" rx="6" fill="url(#layer4Grad)"/>
    <text x="95" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">CAPA 4: APLICACIÓN</text>
    <text x="95" y="44" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Interacción Usuario / Software</text>
    
    <!-- Protocol badges -->
    <g transform="translate(190, 18)">
      <rect x="0" y="0" width="70" height="28" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="35" y="18" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">HTTPS</text>
      
      <rect x="80" y="0" width="55" height="28" rx="5" fill="#0f172a" stroke="#60a5fa" stroke-width="1"/>
      <text x="107" y="18" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">HTTP</text>

      <rect x="145" y="0" width="50" height="28" rx="5" fill="#0f172a" stroke="#93c5fd" stroke-width="1"/>
      <text x="170" y="18" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">FTP</text>

      <rect x="205" y="0" width="130" height="28" rx="5" fill="#0f172a" stroke="#bfdbfe" stroke-width="1"/>
      <text x="270" y="18" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">SMTP / IMAP / POP3</text>

      <rect x="345" y="0" width="60" height="28" rx="5" fill="#0f172a" stroke="#60a5fa" stroke-width="1"/>
      <text x="375" y="18" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">TELNET</text>

      <rect x="415" y="0" width="80" height="28" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="455" y="18" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">WebRTC / DNS</text>
    </g>
  </g>

  <!-- LAYER 3: TRANSPORTE -->
  <g transform="translate(50, 135)">
    <rect width="700" height="65" rx="4" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <rect x="15" y="12" width="160" height="40" rx="6" fill="url(#layer3Grad)"/>
    <text x="95" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">CAPA 3: TRANSPORTE</text>
    <text x="95" y="44" fill="#cffafe" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Segmentación y Control Flujo</text>

    <g transform="translate(190, 18)">
      <rect x="0" y="0" width="240" height="28" rx="5" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2"/>
      <text x="120" y="18" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">TCP (Conexión Fiable, ACKs, Handshake)</text>

      <rect x="255" y="0" width="240" height="28" rx="5" fill="#0f172a" stroke="#0891b2" stroke-width="1.2"/>
      <text x="375" y="18" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">UDP (Velocidad Streaming y Video)</text>
    </g>
  </g>

  <!-- LAYER 2: INTERNET / RED -->
  <g transform="translate(50, 210)">
    <rect width="700" height="65" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="15" y="12" width="160" height="40" rx="6" fill="url(#layer2Grad)"/>
    <text x="95" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">CAPA 2: INTERNET (RED)</text>
    <text x="95" y="44" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Direccionamiento y Enrutamiento</text>

    <g transform="translate(190, 18)">
      <rect x="0" y="0" width="180" height="28" rx="5" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
      <text x="90" y="18" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">IP (IPv4 / IPv6)</text>

      <rect x="195" y="0" width="140" height="28" rx="5" fill="#0f172a" stroke="#059669" stroke-width="1.2"/>
      <text x="265" y="18" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ICMP (Ping / Diagnóstico)</text>

      <rect x="350" y="0" width="145" height="28" rx="5" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
      <text x="422" y="18" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Enrutadores (Routers)</text>
    </g>
  </g>

  <!-- LAYER 1: ACCESO A RED -->
  <g transform="translate(50, 285)">
    <rect width="700" height="65" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="15" y="12" width="160" height="40" rx="6" fill="url(#layer1Grad)"/>
    <text x="95" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">CAPA 1: ACCESO A RED</text>
    <text x="95" y="44" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Medio Físico y Enlace de Datos</text>

    <g transform="translate(190, 18)">
      <rect x="0" y="0" width="150" height="28" rx="5" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="75" y="18" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Ethernet (Cables UTP)</text>

      <rect x="165" y="0" width="160" height="28" rx="5" fill="#0f172a" stroke="#d97706" stroke-width="1.2"/>
      <text x="245" y="18" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Wi-Fi (Ondas de Radio)</text>

      <rect x="340" y="0" width="155" height="28" rx="5" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="417" y="18" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Fibra Óptica Submarina</text>
    </g>
  </g>

  <text x="400" y="380" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">
    La suite TCP/IP encapsula los datos desde la Capa de Aplicación hasta el cable físico, garantizando la interoperabilidad global.
  </text>
</svg>