<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#1c1c1f"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="380" rx="4" fill="url(#bgGrad)" stroke="#2e2e33" stroke-width="1.5"/>

  <rect x="250" y="18" width="300" height="28" rx="4" fill="#202024" stroke="#3e3e44" stroke-width="1"/>
  <text x="400" y="37" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">ESQUEMA DE CONEXIÓN A INTERNET</text>

  <line x1="140" y1="190" x2="250" y2="190" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4"/>
  <line x1="330" y1="190" x2="390" y2="190" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="490" y1="190" x2="550" y2="190" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="630" y1="190" x2="680" y2="190" stroke="#34d399" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- NODE 1: Dispositivo del Estudiante -->
  <g transform="translate(60, 130)">
    <rect width="90" height="120" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1.8"/>
    <rect x="18" y="22" width="54" height="38" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <line x1="26" y1="34" x2="64" y2="34" stroke="#60a5fa" stroke-width="2"/>
    <line x1="26" y1="42" x2="52" y2="42" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="26" y1="49" x2="58" y2="49" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M12 68 L78 68 L72 74 L18 74 Z" fill="#334155"/>
    <text x="45" y="94" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Dispositivo</text>
    <text x="45" y="108" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Cliente / Usuario</text>
  </g>

  <!-- NODE 2: Router Residencial -->
  <g transform="translate(250, 140)">
    <rect width="80" height="100" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="27" y1="20" x2="18" y2="5" stroke="#38bdf8" stroke-width="2"/>
    <line x1="53" y1="20" x2="62" y2="5" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="18" cy="5" r="2.5" fill="#38bdf8"/>
    <circle cx="62" cy="5" r="2.5" fill="#38bdf8"/>
    <rect x="15" y="24" width="50" height="26" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <circle cx="26" cy="37" r="3" fill="#10b981"/>
    <circle cx="36" cy="37" r="3" fill="#10b981"/>
    <circle cx="46" cy="37" r="3" fill="#38bdf8"/>
    <circle cx="56" cy="37" r="3" fill="#38bdf8"/>
    <text x="40" y="70" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Router / LAN</text>
    <text x="40" y="84" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Gateway Local</text>
  </g>

  <!-- NODE 3: Internet WAN -->
  <g transform="translate(390, 125)">
    <path d="M 25 70 A 25 25 0 0 1 45 35 A 35 35 0 0 1 85 25 A 35 35 0 0 1 115 50 A 25 25 0 0 1 120 70 A 20 20 0 0 1 105 85 L 35 85 A 20 20 0 0 1 25 70 Z" fill="url(#primaryGrad)" opacity="0.25"/>
    <path d="M 25 70 A 25 25 0 0 1 45 35 A 35 35 0 0 1 85 25 A 35 35 0 0 1 115 50 A 25 25 0 0 1 120 70 A 20 20 0 0 1 105 85 L 35 85 A 20 20 0 0 1 25 70 Z" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text x="75" y="55" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">INTERNET</text>
    <text x="75" y="70" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Red WAN / Troncal</text>
  </g>

  <!-- NODE 4: Firewall Institucional -->
  <g transform="translate(550, 140)">
    <rect width="80" height="100" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="20" y="24" width="40" height="26" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <path d="M 24 37 L 56 37 M 38 24 L 38 37 M 44 37 L 44 50" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="40" y="70" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Firewall</text>
    <text x="40" y="84" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Seguridad / DMZ</text>
  </g>

  <!-- NODE 5: Servidor Campus Virtual -->
  <g transform="translate(670, 130)">
    <rect width="90" height="120" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
    <rect x="18" y="22" width="54" height="15" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <circle cx="27" cy="29" r="2.5" fill="#34d399"/>
    <circle cx="35" cy="29" r="2.5" fill="#34d399"/>
    <line x1="45" y1="29" x2="62" y2="29" stroke="#334155" stroke-width="2"/>

    <rect x="18" y="42" width="54" height="15" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <circle cx="27" cy="49" r="2.5" fill="#34d399"/>
    <circle cx="35" cy="49" r="2.5" fill="#34d399"/>
    <line x1="45" y1="49" x2="62" y2="49" stroke="#334155" stroke-width="2"/>

    <rect x="18" y="62" width="54" height="15" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <circle cx="27" cy="69" r="2.5" fill="#34d399"/>
    <circle cx="35" cy="69" r="2.5" fill="#34d399"/>
    <line x1="45" y1="69" x2="62" y2="69" stroke="#334155" stroke-width="2"/>

    <text x="45" y="96" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Servidor LMS</text>
    <text x="45" y="110" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Aula Virtual / BD</text>
  </g>

  <g transform="translate(60, 310)">
    <rect width="680" height="42" rx="4" fill="rgba(24, 24, 27, 0.9)" stroke="#2e2e33" stroke-width="1"/>
    <circle cx="20" cy="21" r="5" fill="#38bdf8"/>
    <text x="35" y="25" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">
      <tspan font-weight="700" fill="#f8fafc">Flujo de Conexión:</tspan> Petición HTTP/S → Enrutamiento IP → Conmutación Troncal → Filtro Firewall → Respuesta del Aula Virtual.
    </text>
  </g>
</svg>