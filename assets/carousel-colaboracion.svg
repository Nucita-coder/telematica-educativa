<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <rect width="1200" height="500" fill="#18181b"/>
  <defs>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="500" fill="url(#grid3)"/>

  <!-- Collaborative Graphic -->
  <g transform="translate(200, 60)">
    <!-- Central Shared Workspace / Cloud Document -->
    <rect x="300" y="90" width="200" height="150" rx="6" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
    <rect x="315" y="105" width="170" height="24" rx="3" fill="#18181b"/>
    <text x="400" y="121" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Wiki / Repositorio Común</text>
    
    <!-- Code / Text lines in shared document -->
    <line x1="325" y1="145" x2="460" y2="145" stroke="#3b82f6" stroke-width="2"/>
    <line x1="325" y1="160" x2="430" y2="160" stroke="#71717a" stroke-width="2"/>
    <line x1="325" y1="175" x2="470" y2="175" stroke="#71717a" stroke-width="2"/>
    <line x1="325" y1="190" x2="410" y2="190" stroke="#71717a" stroke-width="2"/>
    <line x1="325" y1="205" x2="450" y2="205" stroke="#71717a" stroke-width="2"/>

    <!-- Collaborative user nodes -->
    <!-- User A -->
    <circle cx="140" cy="90" r="30" fill="#27272a" stroke="#3b82f6" stroke-width="2"/>
    <text x="140" y="94" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Participante 1</text>
    <line x1="170" y1="100" x2="300" y2="130" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- User B -->
    <circle cx="140" cy="230" r="30" fill="#27272a" stroke="#3b82f6" stroke-width="2"/>
    <text x="140" y="234" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Participante 2</text>
    <line x1="170" y1="220" x2="300" y2="180" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- User C -->
    <circle cx="660" cy="90" r="30" fill="#27272a" stroke="#3b82f6" stroke-width="2"/>
    <text x="660" y="94" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Docente / Tutor</text>
    <line x1="630" y1="100" x2="500" y2="130" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- User D -->
    <circle cx="660" cy="230" r="30" fill="#27272a" stroke="#3b82f6" stroke-width="2"/>
    <text x="660" y="234" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Investigador</text>
    <line x1="630" y1="220" x2="500" y2="180" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <!-- Text Overlay Bar -->
  <rect x="0" y="400" width="1200" height="100" fill="#18181b" fill-opacity="0.95" stroke="#27272a" stroke-width="1"/>
  <text x="50" y="440" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="20" font-weight="700">3. El Trabajo Colaborativo mediante Redes</text>
  <text x="50" y="468" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="14">Co-construcción de conocimiento, comunidades de práctica virtuales y espacios de edición e intercambio distribuido.</text>
</svg>