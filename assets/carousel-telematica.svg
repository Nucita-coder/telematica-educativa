<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <rect width="1200" height="500" fill="#18181b"/>
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="500" fill="url(#grid2)"/>

  <!-- Communication Graphic -->
  <g transform="translate(150, 70)">
    <!-- Communication waves / Satellite / Towers -->
    <circle cx="450" cy="180" r="160" fill="none" stroke="#27272a" stroke-width="1.5" stroke-dasharray="6,6"/>
    <circle cx="450" cy="180" r="110" fill="none" stroke="#3f3f46" stroke-width="1.5"/>
    <circle cx="450" cy="180" r="60" fill="none" stroke="#52525b" stroke-width="1.5"/>

    <!-- Central antenna / base station -->
    <path d="M 440 240 L 450 120 L 460 240 Z" fill="#3f3f46"/>
    <line x1="430" y1="240" x2="470" y2="240" stroke="#71717a" stroke-width="3"/>
    <circle cx="450" cy="115" r="8" fill="#3b82f6"/>
    <circle cx="450" cy="115" r="18" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>

    <!-- Side Devices -->
    <!-- Device 1: Videoconference screen -->
    <rect x="120" y="100" width="140" height="90" rx="4" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
    <rect x="130" y="110" width="120" height="65" rx="2" fill="#18181b"/>
    <circle cx="160" cy="135" r="12" fill="#3f3f46"/>
    <circle cx="210" cy="135" r="12" fill="#3f3f46"/>
    <text x="190" y="186" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Síncrono: WebRTC</text>

    <!-- Device 2: Forum / Discussion message -->
    <rect x="660" y="100" width="150" height="90" rx="4" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
    <line x1="680" y1="120" x2="780" y2="120" stroke="#71717a" stroke-width="2"/>
    <line x1="680" y1="135" x2="750" y2="135" stroke="#52525b" stroke-width="2"/>
    <line x1="680" y1="150" x2="770" y2="150" stroke="#52525b" stroke-width="2"/>
    <text x="735" y="186" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Asíncrono: Foros / Mail</text>

    <!-- Communication links -->
    <line x1="260" y1="145" x2="430" y2="125" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="660" y1="145" x2="470" y2="125" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <!-- Text Overlay Bar -->
  <rect x="0" y="400" width="1200" height="100" fill="#18181b" fill-opacity="0.95" stroke="#27272a" stroke-width="1"/>
  <text x="50" y="440" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="20" font-weight="700">2. Tecnologías para la Comunicación</text>
  <text x="50" y="468" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="14">Herramientas síncronas de audio/video de baja latencia y servicios asíncronos para el debate y la consulta reflexiva.</text>
</svg>