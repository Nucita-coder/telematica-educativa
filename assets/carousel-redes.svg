<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <rect width="1200" height="500" fill="#18181b"/>
  <!-- Subtle grid -->
  <defs>
    <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="500" fill="url(#grid1)"/>
  
  <!-- Network illustration -->
  <g transform="translate(100, 70)">
    <!-- Interconnected nodes and lines -->
    <path d="M 120 180 L 280 90 L 460 140 L 620 80 L 780 150 L 940 90 L 880 260 L 680 300 L 480 250 L 300 290 Z" fill="none" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.4"/>
    <path d="M 280 90 L 480 250 M 460 140 L 680 300 M 620 80 L 880 260 M 300 290 L 680 300" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4" stroke-opacity="0.3"/>
    
    <!-- Core server rack graphic -->
    <rect x="580" y="160" width="120" height="110" rx="4" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
    <rect x="592" y="175" width="96" height="16" rx="2" fill="#18181b" stroke="#3f3f46"/>
    <circle cx="605" cy="183" r="3" fill="#10b981"/>
    <circle cx="615" cy="183" r="3" fill="#3b82f6"/>
    <rect x="592" y="200" width="96" height="16" rx="2" fill="#18181b" stroke="#3f3f46"/>
    <circle cx="605" cy="208" r="3" fill="#10b981"/>
    <circle cx="615" cy="208" r="3" fill="#3b82f6"/>
    <rect x="592" y="225" width="96" height="16" rx="2" fill="#18181b" stroke="#3f3f46"/>
    <circle cx="605" cy="233" r="3" fill="#10b981"/>
    <circle cx="615" cy="233" r="3" fill="#3b82f6"/>
    <rect x="592" y="248" width="96" height="12" rx="2" fill="#18181b"/>

    <!-- Nodes -->
    <circle cx="120" cy="180" r="16" fill="#27272a" stroke="#3b82f6" stroke-width="2"/>
    <text x="120" y="184" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">LAN</text>

    <circle cx="280" cy="90" r="18" fill="#27272a" stroke="#3b82f6" stroke-width="2"/>
    <text x="280" y="94" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">MAN</text>

    <circle cx="460" cy="140" r="16" fill="#27272a" stroke="#60a5fa" stroke-width="2"/>
    <text x="460" y="144" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">IP/TCP</text>

    <circle cx="620" cy="80" r="18" fill="#27272a" stroke="#3b82f6" stroke-width="2"/>
    <text x="620" y="84" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">WAN</text>

    <circle cx="780" cy="150" r="16" fill="#27272a" stroke="#60a5fa" stroke-width="2"/>
    <text x="780" y="154" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">DNS</text>

    <circle cx="940" cy="90" r="18" fill="#27272a" stroke="#3b82f6" stroke-width="2"/>
    <text x="940" y="94" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">FIBRA</text>

    <circle cx="880" cy="260" r="16" fill="#27272a" stroke="#3b82f6" stroke-width="2"/>
    <text x="880" y="264" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">ROUTER</text>

    <circle cx="480" cy="250" r="16" fill="#27272a" stroke="#3b82f6" stroke-width="2"/>
    <text x="480" y="254" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">HOST</text>

    <circle cx="300" cy="290" r="16" fill="#27272a" stroke="#3b82f6" stroke-width="2"/>
    <text x="300" y="294" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">GATE</text>
  </g>

  <!-- Text Overlay Bar -->
  <rect x="0" y="400" width="1200" height="100" fill="#18181b" fill-opacity="0.95" stroke="#27272a" stroke-width="1"/>
  <text x="50" y="440" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="20" font-weight="700">1. Infraestructura de Redes e Internet</text>
  <text x="50" y="468" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="14">Arquitectura técnica global, suite de protocolos TCP/IP, esquemas de conmutación de paquetes y topologías físicas.</text>
</svg>